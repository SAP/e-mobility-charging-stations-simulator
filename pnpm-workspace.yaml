packages:
  - ui/common
  - ui/cli
  - ui/web

# GHSA-3g3m-2fjr-6pw4 (CVE-2026-118773) affects glob >= 9.0.0 and <= 14.0.1.
# The js-beautify CLI uses glob ^13.0.6, with no patched 13.x release.
# Vue Test Utils bundles the formatter, not the CLI.
overrides:
  'js-beautify>glob': ^14.0.6

allowBuilds:
  '@parcel/watcher': false
  better-sqlite3: false
  bufferutil: false
  es5-ext: false
  esbuild: false
  msgpackr-extract: false
  utf-8-validate: false
